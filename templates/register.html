{% extends "base.html" %}
{% block title %}إنشاء حساب | RA7 STOR{% endblock %}
{% block content %}
<div class="panel narrow" style="margin-top:50px">
  <h2 class="display">إنشاء حساب جديد</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">اسم المستخدم (3 أحرف على الأقل)</label>
    <input id="username" name="username" required minlength="3" maxlength="50" autocomplete="username" autofocus>
    <label for="password">كلمة المرور (6 أحرف على الأقل)</label>
    <input id="password" type="password" name="password" required minlength="6" autocomplete="new-password">
    <button class="btn block">إنشاء الحساب</button>
  </form>
  <p class="muted" style="margin-top:16px">لديك حساب؟ <a href="{{ url_for('login') }}" style="color:var(--primary-2)">سجّل الدخول</a></p>
</div>
{% endblock %}
