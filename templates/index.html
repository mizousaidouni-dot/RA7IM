<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التوليد وإدارة الصلاحيات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090c14;
      --card: #111623;
      --card-2: #0b0f19;
      --border: #1e273b;
      --accent: #6366f1;
      --accent-2: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --ok: #10b981;
      --err: #ef4444;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand i {
      color: var(--accent);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
    }

    .pill.owner {
      color: #a5b4fc;
      border-color: rgba(99, 102, 241, 0.45);
    }

    .pill.user {
      color: var(--ok);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .grid-main {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 920px) {
      .grid-main {
        grid-template-columns: 1fr;
      }
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .input, select {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.92rem;
    }

    .input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .hint-mono {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #93c5fd;
      font-family: 'JetBrains Mono', monospace;
      direction: ltr;
      text-align: left;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.15s;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-2);
    }

    .btn-ghost {
      background: var(--card-2);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .btn-ok {
      background: rgba(16, 185, 129, 0.14);
      color: var(--ok);
      border-color: rgba(16, 185, 129, 0.35);
    }

    .btn-err {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .log-box {
      background: #06080f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      height: 110px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      direction: ltr;
      text-align: left;
      margin-bottom: 14px;
    }

    .log-info { color: #38bdf8; }
    .log-ok { color: #10b981; }
    .log-err { color: #f87171; }

    /* عرض مختصر ومرتب للحسابات دون إغراق الشاشة */
    .acc-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .acc-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .acc-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      direction: ltr;
    }

    .acc-nick {
      font-weight: 700;
      color: #fff;
    }

    .acc-uid {
      color: #a5b4fc;
    }

    .acc-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .mini {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 7px;
    }

    .acc-details {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      direction: ltr;
      text-align: left;
      word-break: break-all;
      color: var(--muted);
    }

    .acc-details.open {
      display: block;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 700;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      direction: ltr;
      text-align: left;
    }

    .auth-box {
      max-width: 440px;
      margin: 28px auto;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 18px;
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--accent);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 0.2s;
      z-index: 99;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <i class="fa-solid fa-key"></i>
        <span>نظام التوليد وكلمات السر</span>
      </div>
      <div class="top-actions">
        <span class="pill" id="session-pill">غير مسجل</span>
        <button class="btn btn-ghost mini hidden" id="logout-btn" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> خروج
        </button>
      </div>
    </div>

    <!-- واجهة الدخول: كلمة سر للمستخدم أو دخول المالك -->
    <section class="card auth-box" id="login-section">
      <div class="card-title">
        <span>تسجيل الدخول</span>
      </div>

      <div class="tabs">
        <button type="button" class="btn btn-ghost tab-btn active" id="tab-key" onclick="switchLoginTab('key')">
          دخول بكلمة سر
        </button>
        <button type="button" class="btn btn-ghost tab-btn" id="tab-owner" onclick="switchLoginTab('owner')">
          دخول المالك
        </button>
      </div>

      <div id="form-key-login">
        <div class="form-group">
          <label for="access-key-input">أدخل كلمة السر المخصصة</label>
          <input type="text" id="access-key-input" class="input mono" placeholder="مثال: RAHIM-VIP-4">
        </div>
        <button type="button" class="btn btn-primary" onclick="loginWithKey()">
          <i class="fa-solid fa-unlock"></i> دخول
        </button>
      </div>

      <div id="form-owner-login" class="hidden">
        <div class="form-group">
          <label for="owner-user-input">اسم المالك</label>
          <input type="text" id="owner-user-input" class="input" value="OWNER">
        </div>
        <div class="form-group">
          <label for="owner-pass-input">كلمة سر المالك</label>
          <input type="password" id="owner-pass-input" class="input" placeholder="كلمة سر المالك">
        </div>
        <button type="button" class="btn btn-primary" onclick="loginAsOwner()">
          <i class="fa-solid fa-crown"></i> دخول حساب المالك
        </button>
      </div>
    </section>

    <!-- لوحة المالك لإدارة كلمات السر وعدد الأشخاص المسموح لهم -->
    <section class="card hidden" id="owner-panel">
      <div class="card-title">
        <span>إدارة كلمات السر (حساب المالك المتحكم)</span>
        <button type="button" class="btn btn-ghost mini" onclick="loadOwnerKeys()">
          <i class="fa-solid fa-rotate"></i> تحديث
        </button>
      </div>

      <div class="grid-2" style="margin-bottom: 14px;">
        <div class="form-group" style="margin-bottom:0;">
          <label for="new-key-code">كلمة السر الجديدة (اختياري - يولّد تلقائياً إذا ترك فارغاً)</label>
          <input type="text" id="new-key-code" class="input mono" placeholder="مثال: TEAM-RAHIM-4">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="new-key-users">صالحة لكم شخص؟ (مثال: 4)</label>
          <input type="number" id="new-key-users" class="input" value="4" min="1" max="500">
        </div>
      </div>

      <button type="button" class="btn btn-ok" style="margin-bottom: 14px;" onclick="createAccessKey()">
        <i class="fa-solid fa-plus"></i> إنشاء كلمة سر
      </button>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>كلمة السر</th>
              <th>الأشخاص</th>
              <th>التوليدات</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="keys-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- لوحة التوليد والنتائج المرتبة -->
    <section class="grid-main hidden" id="generator-section">
      <div class="card">
        <div class="card-title">
          <span>إعدادات التوليد</span>
        </div>

        <div class="form-group">
          <label for="base-name">الاسم الأساسي (حتى 9 أحرف)</label>
          <input type="text" id="base-name" class="input" value="RAHIM" maxlength="9" oninput="updatePreview()">
          <div class="hint-mono" id="name-preview">RAHIM4829103 (12)</div>
        </div>

        <div class="form-group">
          <label for="region-select">السيرفر</label>
          <select id="region-select">
            <option value="ME">ME - Middle East</option>
            <option value="IND">IND - India</option>
            <option value="BD">BD - Bangladesh</option>
            <option value="SG">SG - Singapore</option>
            <option value="ID">ID - Indonesia</option>
            <option value="TH">TH - Thailand</option>
            <option value="PK">PK - Pakistan</option>
            <option value="VN">VN - Vietnam</option>
            <option value="BR">BR - Brazil</option>
            <option value="US">US - United States</option>
          </select>
        </div>

        <div class="form-group">
          <label for="count-input">العدد (1 - 100)</label>
          <input type="number" id="count-input" class="input" value="1" min="1" max="100">
          <div class="presets">
            <button type="button" class="btn btn-ghost mini" onclick="setCount(1)">1</button>
            <button type="button" class="btn btn-ghost mini" onclick="setCount(10)">10</button>
            <button type="button" class="btn btn-ghost mini" onclick="setCount(50)">50</button>
            <button type="button" class="btn btn-ghost mini" onclick="setCount(100)">100</button>
          </div>
        </div>

        <button type="button" class="btn btn-primary" id="gen-btn" onclick="generateAccounts()">
          <i class="fa-solid fa-play"></i> توليد
        </button>
      </div>

      <div class="card">
        <div class="card-title">
          <span>الحسابات المولّدة (<span id="acc-count">0</span>)</span>
        </div>

        <div class="toolbar">
          <button type="button" class="btn btn-ghost mini" id="copy-all-btn" onclick="copyAllSummary()" disabled>
            <i class="fa-regular fa-copy"></i> نسخ الكل (مرتب)
          </button>
          <button type="button" class="btn btn-ghost mini" id="copy-json-btn" onclick="copyAllJson()" disabled>
            <i class="fa-solid fa-code"></i> نسخ الكل (JSON)
          </button>
          <button type="button" class="btn btn-ok mini" id="dl-json-btn" onclick="downloadJson()" disabled>
            <i class="fa-solid fa-download"></i> تحميل JSON
          </button>
          <button type="button" class="btn btn-err mini" onclick="clearAccounts()">
            <i class="fa-solid fa-trash"></i> مسح
          </button>
        </div>

        <div class="log-box" id="log-box">
          <div class="log-info">[READY] Waiting for request...</div>
        </div>

        <div id="accounts-container"></div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let accounts = [];
    let currentRole = null;

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__t);
      window.__t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function logMsg(msg, cls = 'info') {
      const box = document.getElementById('log-box');
      const div = document.createElement('div');
      div.className = 'log-' + cls;
      div.textContent = msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function setCount(n) {
      document.getElementById('count-input').value = n;
    }

    function updatePreview() {
      const raw = document.getElementById('base-name').value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 9);
      const base = raw || 'RAHIM';
      const len = Math.max(2, 12 - base.length);
      const sample = (base + '482910375'.slice(0, len)).slice(0, 12);
      document.getElementById('name-preview').textContent = `${sample} (${sample.length})`;
    }

    function switchLoginTab(tab) {
      document.getElementById('tab-key').classList.toggle('active', tab === 'key');
      document.getElementById('tab-owner').classList.toggle('active', tab === 'owner');
      document.getElementById('form-key-login').classList.toggle('hidden', tab !== 'key');
      document.getElementById('form-owner-login').classList.toggle('hidden', tab !== 'owner');
    }

    async function copyStr(text, label = 'البيانات') {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      toast(`تم نسخ ${label}`);
    }

    function applySessionUI(info) {
      const pill = document.getElementById('session-pill');
      const logoutBtn = document.getElementById('logout-btn');
      const loginSec = document.getElementById('login-section');
      const ownerPanel = document.getElementById('owner-panel');
      const genSec = document.getElementById('generator-section');

      if (!info || !info.authenticated) {
        currentRole = null;
        pill.className = 'pill';
        pill.textContent = 'غير مسجل';
        logoutBtn.classList.add('hidden');
        loginSec.classList.remove('hidden');
        ownerPanel.classList.add('hidden');
        genSec.classList.add('hidden');
        return;
      }

      currentRole = info.role;
      logoutBtn.classList.remove('hidden');
      loginSec.classList.add('hidden');
      genSec.classList.remove('hidden');

      if (info.role === 'owner') {
        pill.className = 'pill owner';
        pill.textContent = `المالك (${info.label})`;
        ownerPanel.classList.remove('hidden');
        loadOwnerKeys();
      } else {
        pill.className = 'pill user';
        pill.textContent = `مفتاح: ${info.access_key} (${info.current_users}/${info.max_users})`;
        ownerPanel.classList.add('hidden');
      }
    }

    async function checkSession() {
      const res = await fetch('/api/session');
      const data = await res.json();
      applySessionUI(data);
    }

    async function loginWithKey() {
      const key = document.getElementById('access-key-input').value.trim();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'key', key })
      });
      const data = await res.json();
      if (!data.ok) return toast(data.error || 'فشل الدخول');
      applySessionUI(data.session);
      toast('تم الدخول بنجاح');
    }

    async function loginAsOwner() {
      const username = document.getElementById('owner-user-input').value.trim();
      const password = document.getElementById('owner-pass-input').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'owner', username, password })
      });
      const data = await res.json();
      if (!data.ok) return toast(data.error || 'بيانات المالك خاطئة');
      applySessionUI(data.session);
      toast('مرحباً بالمالك');
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      checkSession();
    }

    async function loadOwnerKeys() {
      const res = await fetch('/api/owner/keys');
      const data = await res.json();
      if (!data.ok) return;
      const tbody = document.getElementById('keys-tbody');
      tbody.innerHTML = '';
      (data.keys || []).forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="mono">${esc(item.key)}</td>
          <td>${item.current_users} / ${item.max_users}</td>
          <td>${item.generations_used}</td>
          <td>${item.active ? 'نشط' : 'متوقف'}</td>
          <td>
            <button type="button" class="btn btn-ghost mini" onclick="copyStr('${esc(item.key)}', 'كلمة السر')">نسخ</button>
            <button type="button" class="btn btn-ghost mini" onclick="toggleKey('${esc(item.key)}')">تبديل</button>
            <button type="button" class="btn btn-err mini" onclick="deleteKey('${esc(item.key)}')">حذف</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function createAccessKey() {
      const key = document.getElementById('new-key-code').value.trim();
      const maxUsers = parseInt(document.getElementById('new-key-users').value, 10) || 4;
      const res = await fetch('/api/owner/keys/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, max_users: maxUsers })
      });
      const data = await res.json();
      if (!data.ok) return toast(data.error || 'تعذر الإنشاء');
      document.getElementById('new-key-code').value = '';
      toast(`تم إنشاء الكلمة: ${data.key} (${data.max_users} أشخاص)`);
      loadOwnerKeys();
    }

    async function toggleKey(key) {
      await fetch('/api/owner/keys/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key })
      });
      loadOwnerKeys();
    }

    async function deleteKey(key) {
      await fetch('/api/owner/keys/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key })
      });
      loadOwnerKeys();
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function toggleDetails(idx) {
      const el = document.getElementById('acc-det-' + idx);
      if (el) el.classList.toggle('open');
    }

    function formatSummaryLine(acc, i) {
      return `${i + 1}. ${acc.nickname} | UID: ${acc.uid} | PASS: ${acc.password}`;
    }

    function copyAllSummary() {
      if (!accounts.length) return;
      const txt = accounts.map((a, i) => formatSummaryLine(a, i)).join('
');
      copyStr(txt, 'جميع الحسابات المرتبة');
    }

    function copyAllJson() {
      if (!accounts.length) return;
      copyStr(JSON.stringify(accounts, null, 2), 'JSON');
    }

    function downloadJson() {
      if (!accounts.length) return;
      const blob = new Blob([JSON.stringify(accounts, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `accounts_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('تم التحميل');
    }

    function clearAccounts() {
      accounts = [];
      document.getElementById('acc-count').textContent = '0';
      document.getElementById('accounts-container').innerHTML = '';
      document.getElementById('copy-all-btn').disabled = true;
      document.getElementById('copy-json-btn').disabled = true;
      document.getElementById('dl-json-btn').disabled = true;
    }

    function renderAccounts() {
      const box = document.getElementById('accounts-container');
      box.innerHTML = '';
      document.getElementById('acc-count').textContent = accounts.length;

      accounts.forEach((acc, i) => {
        const div = document.createElement('div');
        div.className = 'acc-item';
        div.innerHTML = `
          <div class="acc-head">
            <div class="acc-main">
              <span>#${i + 1}</span>
              <span class="acc-nick">${esc(acc.nickname)}</span>
              <span class="acc-uid">UID: ${esc(acc.uid)}</span>
            </div>
            <div class="acc-btns">
              <button type="button" class="btn btn-ghost mini" onclick="copyStr('${esc(formatSummaryLine(acc, i))}', 'الحساب')">نسخ</button>
              <button type="button" class="btn btn-ghost mini" onclick="copyStr('${esc(JSON.stringify(acc, null, 2))}', 'JSON')">JSON</button>
              <button type="button" class="btn btn-ghost mini" onclick="toggleDetails(${i})">تفاصيل</button>
            </div>
          </div>
          <div class="acc-details" id="acc-det-${i}">
            <div>PASSWORD: ${esc(acc.password)}</div>
            <div>OPEN_ID: ${esc(acc.open_id)}</div>
            <div>TOKEN: ${esc(acc.access_token)}</div>
          </div>
        `;
        box.appendChild(div);
      });
    }

    async function generateAccounts() {
      const region = document.getElementById('region-select').value;
      const baseName = document.getElementById('base-name').value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 9) || 'RAHIM';
      let count = parseInt(document.getElementById('count-input').value, 10) || 1;
      count = Math.max(1, Math.min(100, count));

      const btn = document.getElementById('gen-btn');
      btn.disabled = true;
      logMsg(`[REQ] region=${region} name=${baseName} count=${count}`, 'info');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ region, base_name: baseName, count })
        });
        const data = await res.json();

        if (data.session) applySessionUI(data.session);

        if (data.accounts && data.accounts.length) {
          accounts = accounts.concat(data.accounts);
          renderAccounts();
          document.getElementById('copy-all-btn').disabled = false;
          document.getElementById('copy-json-btn').disabled = false;
          document.getElementById('dl-json-btn').disabled = false;
          logMsg(`[OK] Generated ${data.accounts.length}`, 'ok');
        }

        if (data.errors && data.errors.length) {
          [...new Set(data.errors)].slice(0, 5).forEach(e => logMsg(`[ERR] ${e}`, 'err'));
        } else if (!data.accounts || !data.accounts.length) {
          logMsg(`[ERR] ${data.error || 'No accounts generated'}`, 'err');
        }
      } catch (e) {
        logMsg(`[ERR] ${e.message}`, 'err');
      } finally {
        btn.disabled = false;
      }
    }

    checkSession();
  </script>
</body>
</html>
